[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dietapp-stt"
version = "0.1.0"
description = "Speech-to-text for short voice notes (faster-whisper, CPU)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "faster-whisper>=1.0",
    # faster-whisper 1.2 passes av.open(metadata_errors=...), which PyAV 19 removed.
    "av>=11,<19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["stt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
