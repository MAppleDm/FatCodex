[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dietapp-nutrition"
version = "0.1.0"
description = "Food lookup and KBZHU (kcal/protein/fat/carbs) calculation over a local USDA + Open Food Facts import"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["nutrition*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
