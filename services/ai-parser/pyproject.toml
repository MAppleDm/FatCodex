[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dietapp-ai-parser"
version = "0.1.0"
description = "Turns free-form food text/photos into structured items via DeepSeek function calling. Never produces calories."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openai>=1.50",
    "httpx>=0.27",
    "redis>=5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools.package-data]
ai_parser = ["system_prompt.txt", "tool_spec.json"]

[tool.setuptools.packages.find]
include = ["ai_parser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
